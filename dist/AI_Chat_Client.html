<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Client</title>
    <style>
        /* === styles.css === */
/* ==================== AI Chat Client Styles ==================== */
/* Inspired by ChatGPT and Claude UI */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #212121;
    --bg-secondary: #171717;
    --bg-tertiary: #2d2d2d;
    --bg-hover: #343541;
    --bg-input: #40414f;
    --border-color: #565869;
    --text-primary: #ececec;
    --text-secondary: #8e8ea0;
    --accent-color: #10a37f;
    --accent-hover: #1a7f64;
    --error-color: #ef4444;
    --warning-color: #f59e0b;
    --user-bg: #343541;
    --assistant-bg: #444654;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
}

/* ==================== Layout ==================== */
.app-container {
    display: flex;
    height: 100vh;
}

/* ==================== Sidebar ==================== */
.sidebar {
    width: 260px;
    background-color: var(--bg-secondary);
    border-right: 1px solid var(--bg-tertiary);
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease;
}

.sidebar.collapsed {
    width: 0;
    overflow: hidden;
}

.sidebar-header {
    padding: 12px;
}

#new-chat-btn {
    width: 100%;
    padding: 12px 16px;
    background-color: transparent;
    color: var(--text-primary);
    border: 1px dashed var(--border-color);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

#new-chat-btn:hover {
    background-color: var(--bg-tertiary);
    border-style: solid;
}

/* Chat List */
.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.chat-list::-webkit-scrollbar {
    width: 6px;
}

.chat-list::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
    border-radius: 3px;
}

.chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.chat-item:hover {
    background-color: var(--bg-tertiary);
}

.chat-item.active {
    background-color: var(--bg-hover);
}

.chat-item-content {
    flex: 1;
    overflow: hidden;
}

.chat-title {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
}

.chat-item-actions {
    display: none;
    gap: 4px;
}

.chat-item:hover .chat-item-actions {
    display: flex;
}

.chat-action-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-size: 12px;
    opacity: 0.7;
    transition: opacity 0.2s;
}

.chat-action-btn:hover {
    opacity: 1;
}

.empty-chats {
    text-align: center;
    padding: 20px;
    color: var(--text-secondary);
    font-size: 14px;
}

/* Sidebar Footer */
.sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--bg-tertiary);
}

#settings-btn {
    width: 40px;
    height: 40px;
    background-color: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    color: var(--text-secondary);
    transition: all 0.2s;
}

#settings-btn:hover {
    background-color: var(--bg-tertiary);
    color: var(--text-primary);
}

/* ==================== Main Content ==================== */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--bg-tertiary);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

#toggle-sidebar-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
}

.header-title {
    font-size: 16px;
    font-weight: 600;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.model-selector-label {
    color: var(--text-secondary);
    font-size: 13px;
}

#model-selector {
    background-color: var(--bg-input);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    min-width: 180px;
}

#model-selector:hover {
    border-color: var(--text-secondary);
}

#model-selector:focus {
    outline: none;
    border-color: var(--accent-color);
}

/* ==================== Welcome Screen ==================== */
.welcome-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
}

.welcome-title {
    font-size: 32px;
    font-weight: 600;
    margin-bottom: 16px;
}

.welcome-subtitle {
    color: var(--text-secondary);
    font-size: 16px;
}

/* ==================== Chat Area ==================== */
.chat-area {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

.messages-container::-webkit-scrollbar {
    width: 8px;
}

.messages-container::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
    border-radius: 4px;
}

/* Messages */
.message {
    max-width: 800px;
    margin: 0 auto 24px;
    padding: 16px 24px;
    border-radius: 16px;
}

.user-message {
    background-color: var(--user-bg);
    margin-left: 60px;
}

.assistant-message {
    background-color: var(--assistant-bg);
    margin-right: 60px;
}

.message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.message-role {
    font-weight: 600;
    font-size: 14px;
}

.message-model {
    color: var(--text-secondary);
    font-size: 12px;
}

.message-content {
    font-size: 14px;
    line-height: 1.7;
}

.message-content pre {
    background-color: var(--bg-secondary);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 12px 0;
}

.message-content code {
    font-family: 'Fira Code', 'Consolas', monospace;
    background-color: var(--bg-secondary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
}

.message-content pre code {
    background: none;
    padding: 0;
}

.message-content a {
    color: var(--accent-color);
    text-decoration: none;
}

.message-content a:hover {
    text-decoration: underline;
}

.message.streaming .message-content::after {
    content: '▋';
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}

/* ==================== Input Area ==================== */
.input-area {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--bg-tertiary);
}

.input-container {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 12px;
}

.input-container:focus-within {
    border-color: var(--accent-color);
}

#message-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    resize: none;
    min-height: 24px;
    max-height: 150px;
    font-family: inherit;
    line-height: 1.5;
}

#message-input::placeholder {
    color: var(--text-secondary);
}

#message-input:focus {
    outline: none;
}

#send-btn {
    background-color: var(--accent-color);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
    align-self: flex-end;
}

#send-btn:hover {
    background-color: var(--accent-hover);
}

#send-btn:disabled {
    background-color: var(--border-color);
    cursor: not-allowed;
}

/* ==================== Settings Dialog ==================== */
.settings-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.settings-overlay.visible {
    display: flex;
}

.settings-dialog {
    background-color: var(--bg-primary);
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--bg-tertiary);
}

.settings-title {
    font-size: 18px;
    font-weight: 600;
}

#settings-close-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
}

#settings-close-btn:hover {
    color: var(--text-primary);
}

/* Settings Tabs */
.settings-tabs {
    display: flex;
    border-bottom: 1px solid var(--bg-tertiary);
    padding: 0 24px;
}

.settings-tab-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
}

.settings-tab-btn:hover {
    color: var(--text-primary);
}

.settings-tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent-color);
}

.settings-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

.settings-tab-content {
    display: none;
}

.settings-tab-content.active {
    display: block;
}

/* Form Elements */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-secondary);
}

.input-with-button {
    display: flex;
    gap: 8px;
}

.input-with-button input {
    flex: 1;
}

.form-group input[type="text"],
.form-group input[type="password"] {
    width: 100%;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    color: var(--text-primary);
    font-size: 14px;
}

.form-group input:focus {
    outline: none;
    border-color: var(--accent-color);
}

.toggle-visibility-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 8px;
}

.section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--bg-tertiary);
}

/* LM Studio Section */
.connect-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
}

#lmstudio-connect-btn {
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s;
}

#lmstudio-connect-btn:hover {
    background-color: #1d4ed8;
}

.connection-status {
    font-size: 13px;
    color: var(--text-secondary);
}

.connection-status.success {
    color: var(--accent-color);
}

.connection-status.error {
    color: var(--error-color);
}

.connection-status.warning {
    color: var(--warning-color);
}

.connection-status.pending {
    color: var(--text-secondary);
}

#lmstudio-models-list {
    margin-top: 16px;
}

.lmstudio-model-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background-color: var(--bg-tertiary);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
}

.no-models {
    color: var(--text-secondary);
    font-size: 13px;
    font-style: italic;
}

/* Model Visibility Checkboxes */
.models-group {
    margin-bottom: 20px;
}

.models-group-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-primary);
}

.checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.checkbox-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent-color);
}

.checkbox-item label {
    font-size: 14px;
    cursor: pointer;
    margin: 0;
}

/* Settings Footer */
.settings-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--bg-tertiary);
}

.settings-footer button {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
}

#settings-cancel-btn {
    background-color: var(--bg-tertiary);
    color: var(--text-primary);
    border: none;
}

#settings-cancel-btn:hover {
    background-color: var(--border-color);
}

#settings-save-btn {
    background-color: var(--accent-color);
    color: white;
    border: none;
}

#settings-save-btn:hover {
    background-color: var(--accent-hover);
}

/* ==================== Responsive ==================== */
@media (max-width: 768px) {
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        z-index: 100;
        transform: translateX(0);
    }

    .sidebar.collapsed {
        transform: translateX(-100%);
        width: 260px;
    }

    #toggle-sidebar-btn {
        display: block;
    }

    .message {
        margin-left: 16px !important;
        margin-right: 16px !important;
    }

    .header {
        padding: 12px 16px;
    }

    .input-area {
        padding: 12px 16px 16px;
    }
}


    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn">+ New Chat</button>
            </div>

            <div class="chat-list" id="chat-list">
                <!-- Chat history items will be inserted here -->
            </div>

            <div class="sidebar-footer">
                <button id="settings-btn" title="Settings">⚙️</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button id="toggle-sidebar-btn">☰</button>
                    <span class="header-title">AI Chat</span>
                </div>
                <div class="header-right">
                    <span class="model-selector-label">Model:</span>
                    <select id="model-selector">
                        <!-- Models will be populated by JavaScript -->
                    </select>
                </div>
            </header>

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcome-screen">
                <h1 class="welcome-title">AI Chat Client</h1>
                <p class="welcome-subtitle">Start a new conversation or select one from the sidebar</p>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chat-area">
                <div class="messages-container" id="messages-container">
                    <!-- Messages will be inserted here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea
                        id="message-input"
                        placeholder="Type your message..."
                        rows="1"
                    ></textarea>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Dialog -->
    <div class="settings-overlay" id="settings-dialog">
        <div class="settings-dialog">
            <div class="settings-header">
                <h2 class="settings-title">Settings</h2>
                <button id="settings-close-btn">&times;</button>
            </div>

            <div class="settings-tabs">
                <button class="settings-tab-btn active" data-tab="api-keys">API Keys</button>
                <button class="settings-tab-btn" data-tab="lmstudio">LM Studio</button>
                <button class="settings-tab-btn" data-tab="models">Model Visibility</button>
            </div>

            <div class="settings-content">
                <!-- API Keys Tab -->
                <div class="settings-tab-content active" id="tab-api-keys">
                    <h3 class="section-title">OpenAI</h3>
                    <div class="form-group">
                        <label for="openai-key">API Key</label>
                        <div class="input-with-button">
                            <input type="password" id="openai-key" placeholder="sk-...">
                            <button class="toggle-visibility-btn">👁️</button>
                        </div>
                    </div>

                    <h3 class="section-title">Anthropic (Claude)</h3>
                    <div class="form-group">
                        <label for="anthropic-key">API Key</label>
                        <div class="input-with-button">
                            <input type="password" id="anthropic-key" placeholder="sk-ant-...">
                            <button class="toggle-visibility-btn">👁️</button>
                        </div>
                    </div>

                    <h3 class="section-title">Google (Gemini)</h3>
                    <div class="form-group">
                        <label for="gemini-key">API Key</label>
                        <div class="input-with-button">
                            <input type="password" id="gemini-key" placeholder="AI...">
                            <button class="toggle-visibility-btn">👁️</button>
                        </div>
                    </div>
                </div>

                <!-- LM Studio Tab -->
                <div class="settings-tab-content" id="tab-lmstudio">
                    <h3 class="section-title">LM Studio Connection</h3>
                    <div class="form-group">
                        <label for="lmstudio-url">Server URL</label>
                        <input type="text" id="lmstudio-url" placeholder="http://localhost:1234">
                    </div>
                    <div class="connect-row">
                        <button id="lmstudio-connect-btn">Connect & Verify</button>
                        <span id="lmstudio-status" class="connection-status"></span>
                    </div>

                    <h3 class="section-title" style="margin-top: 24px;">Available Models</h3>
                    <div id="lmstudio-models-list">
                        <p class="no-models">Click "Connect & Verify" to detect models</p>
                    </div>
                </div>

                <!-- Model Visibility Tab -->
                <div class="settings-tab-content" id="tab-models">
                    <h3 class="section-title">Select Visible Models</h3>

                    <div class="models-group">
                        <div class="models-group-title">OpenAI</div>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gpt-4" id="vis-gpt-4" checked>
                                <label for="vis-gpt-4">GPT-4</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gpt-4-turbo" id="vis-gpt-4-turbo" checked>
                                <label for="vis-gpt-4-turbo">GPT-4 Turbo</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gpt-4o" id="vis-gpt-4o" checked>
                                <label for="vis-gpt-4o">GPT-4o</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gpt-4o-mini" id="vis-gpt-4o-mini" checked>
                                <label for="vis-gpt-4o-mini">GPT-4o Mini</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gpt-3.5-turbo" id="vis-gpt-35-turbo" checked>
                                <label for="vis-gpt-35-turbo">GPT-3.5 Turbo</label>
                            </div>
                        </div>
                    </div>

                    <div class="models-group">
                        <div class="models-group-title">Anthropic</div>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="claude-3-opus" id="vis-claude-3-opus" checked>
                                <label for="vis-claude-3-opus">Claude 3 Opus</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="claude-3-sonnet" id="vis-claude-3-sonnet" checked>
                                <label for="vis-claude-3-sonnet">Claude 3 Sonnet</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="claude-3-haiku" id="vis-claude-3-haiku" checked>
                                <label for="vis-claude-3-haiku">Claude 3 Haiku</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="claude-3.5-sonnet" id="vis-claude-35-sonnet" checked>
                                <label for="vis-claude-35-sonnet">Claude 3.5 Sonnet</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="claude-3.5-haiku" id="vis-claude-35-haiku" checked>
                                <label for="vis-claude-35-haiku">Claude 3.5 Haiku</label>
                            </div>
                        </div>
                    </div>

                    <div class="models-group">
                        <div class="models-group-title">Google</div>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gemini-pro" id="vis-gemini-pro" checked>
                                <label for="vis-gemini-pro">Gemini Pro</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" class="model-visibility-checkbox" data-model="gemini-1.5-pro" id="vis-gemini-15-pro" checked>

// === markdown.js ===
// ==================== Markdown Module ====================
// Simple markdown parser for chat messages

const MarkdownParser = {
    parse(text) {
        if (!text) return '';

        let html = this.escapeHtml(text);

        // Code blocks (```code```)
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
            return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
        });

        // Inline code (`code`)
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold (**text** or __text__)
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

        // Italic (*text* or _text_)
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

        // Links [text](url)
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

        // Headers
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

        // Unordered lists
        html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

        // Ordered lists
        html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

        // Blockquotes
        html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

        // Horizontal rules
        html = html.replace(/^---$/gm, '<hr>');

        // Line breaks (preserve newlines)
        html = html.replace(/\n/g, '<br>');

        // Clean up multiple <br> after block elements
        html = html.replace(/(<\/pre>)<br>/g, '$1');
        html = html.replace(/(<\/h[1-3]>)<br>/g, '$1');
        html = html.replace(/(<\/ul>)<br>/g, '$1');
        html = html.replace(/(<\/blockquote>)<br>/g, '$1');

        return html;
    },

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
};

        { id: 'gpt-4', name: 'GPT-4' },

        { id: 'gpt-4o-mini', name: 'GPT-4o Mini' },
        { id: 'gpt-3.5-turbo', name: 'GPT-3.5 Turbo' }
    ],

    async chat(messages, model, apiKey, onChunk) {
        if (!apiKey) {
            throw new Error('OpenAI API key not set. Please configure it in Settings.');
        }

        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: model,
                messages: messages,
                stream: true
            })
        });

        if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error?.message || `OpenAI API error: ${response.status}`);
        }

        return this.streamResponse(response, onChunk);
    },

    async streamResponse(response, onChunk) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;

                    try {
                        const json = JSON.parse(data);
                        const content = json.choices?.[0]?.delta?.content;
                        if (content) {
                            fullContent += content;
                            if (onChunk) onChunk(content);
                        }
                    } catch (e) {
                        // Skip invalid JSON
                    }
                }
            }
        }

        return fullContent;
    },

    async validate(apiKey) {
        try {
            const response = await fetch('https://api.openai.com/v1/models', {
                headers: {
                    'Authorization': `Bearer ${apiKey}`
                }
            });
            return response.ok;
        } catch (e) {
            return false;
        }
    }
};

// ==================== Google Gemini API Client ====================

const GeminiClient = {
    MODELS: [
        { id: 'gemini-pro', name: 'Gemini Pro', displayKey: 'gemini-pro' },
        { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro', displayKey: 'gemini-1.5-pro' },
        { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash', displayKey: 'gemini-1.5-flash' },
        { id: 'gemini-2.0-flash-exp', name: 'Gemini 2.0 Flash', displayKey: 'gemini-2.0-flash' }
    ],

    async chat(messages, model, apiKey, onChunk) {
        if (!apiKey) {
            throw new Error('Gemini API key not set. Please configure it in Settings.');
        }

        // Convert messages to Gemini format
        const contents = [];
        let systemInstruction = '';

        for (const msg of messages) {
            if (msg.role === 'system') {
                systemInstruction = msg.content;
            } else {
                contents.push({
                    role: msg.role === 'assistant' ? 'model' : 'user',
                    parts: [{ text: msg.content }]
                });
            }
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?key=${apiKey}`;

        const body = { contents };
        if (systemInstruction) {
            body.systemInstruction = { parts: [{ text: systemInstruction }] };
        }

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error?.message || `Gemini API error: ${response.status}`);
        }

        return this.streamResponse(response, onChunk);
    },

    async streamResponse(response, onChunk) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            // Gemini returns JSON array chunks
            try {
                // Try to parse as JSON array
                const jsonMatch = buffer.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                    const data = JSON.parse(jsonMatch[0]);
                    for (const item of data) {
                        const text = item.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            fullContent += text;
                            if (onChunk) onChunk(text);
                        }
                    }
                    buffer = buffer.slice(jsonMatch.index + jsonMatch[0].length);
                }
            } catch (e) {
                // Keep buffering
            }
        }

        // Handle any remaining content
        if (buffer.trim()) {
            try {
                const data = JSON.parse(buffer);
                if (Array.isArray(data)) {
                    for (const item of data) {
                        const text = item.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text && !fullContent.includes(text)) {
                            fullContent += text;
                            if (onChunk) onChunk(text);
                        }
                    }
                }
            } catch (e) {
                // Ignore parse errors
            }
        }

        return fullContent;
    },

    async validate(apiKey) {
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
            const response = await fetch(url);
            return response.ok;
        } catch (e) {
            return false;
        }
    }
};

// ==================== Chat History Manager ====================

const ChatHistory = {
    chats: {},
    currentChatId: null,

    init() {
        this.chats = Storage.getChats();
        this.currentChatId = Storage.getCurrentChatId();
    },

    createNewChat(title = 'New Chat') {
        const chatId = Storage.generateId();
        this.chats[chatId] = {
            id: chatId,
            title: title,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            messages: []
        };
        this.currentChatId = chatId;
        this.save();
        return chatId;
    },

    addMessage(role, content, model = null) {
        if (!this.currentChatId) {
            this.createNewChat();
        }

        const message = {
            role: role,
            content: content,
            timestamp: new Date().toISOString()
        };

        if (model) {
            message.model = model;
        }

        this.chats[this.currentChatId].messages.push(message);
        this.chats[this.currentChatId].updatedAt = new Date().toISOString();

        // Update title if first user message
        if (role === 'user' && this.chats[this.currentChatId].messages.length === 1) {
            const title = content.length > 40 ? content.substring(0, 40) + '...' : content;
            this.chats[this.currentChatId].title = title;
        }

        this.save();
    },

    getMessages(chatId = null) {
        const id = chatId || this.currentChatId;
        if (!id || !this.chats[id]) return [];
        return this.chats[id].messages;
    },

    getChatList() {
        return Object.values(this.chats)
            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
            .map(chat => ({
                id: chat.id,
                title: chat.title,
                updatedAt: chat.updatedAt,
                messageCount: chat.messages.length
            }));
    },

    setCurrentChat(chatId) {
        if (this.chats[chatId]) {
            this.currentChatId = chatId;
            Storage.setCurrentChatId(chatId);
            return true;
        }
        return false;
    },

    deleteChat(chatId) {
        if (this.chats[chatId]) {
            delete this.chats[chatId];
            if (this.currentChatId === chatId) {
                this.currentChatId = null;
                Storage.setCurrentChatId(null);
            }
            this.save();
            return true;
        }
        return false;
    },

    renameChat(chatId, newTitle) {
        if (this.chats[chatId]) {
            this.chats[chatId].title = newTitle;
            this.save();
            return true;
        }
        return false;
    },

    getCurrentChat() {
        if (this.currentChatId && this.chats[this.currentChatId]) {
            return this.chats[this.currentChatId];
        }
        return null;
    },

    save() {
        Storage.saveChats(this.chats);
        Storage.setCurrentChatId(this.currentChatId);
    }
};

        });

        // Toggle sidebar on mobile

            this.toggle();
        });
    },

    refresh() {
        const chats = ChatHistory.getChatList();
        this.chatListElement.innerHTML = '';

        if (chats.length === 0) {
            this.chatListElement.innerHTML = `
                <div class="empty-chats">
                    <p>No conversations yet</p>
                </div>
            `;
            return;
        }

        chats.forEach(chat => {
            const item = this.createChatItem(chat);
            this.chatListElement.appendChild(item);
        });
    },

    createChatItem(chat) {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.dataset.chatId = chat.id;

        if (chat.id === ChatHistory.currentChatId) {
            div.classList.add('active');
        }

        div.innerHTML = `
            <div class="chat-item-content">
                <span class="chat-title">${this.escapeHtml(chat.title)}</span>
            </div>
            <div class="chat-item-actions">
                <button class="chat-action-btn rename-btn" title="Rename">✏️</button>
                <button class="chat-action-btn delete-btn" title="Delete">🗑️</button>
            </div>
        `;

        // Click to select
        div.addEventListener('click', (e) => {
            if (!e.target.closest('.chat-item-actions')) {
                this.onSelectChat(chat.id);
            }
        });

        // Rename button
        div.querySelector('.rename-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.onRenameChat(chat.id, chat.title);
        });

        // Delete button
        div.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.onDeleteChat(chat.id, chat.title);
        });

        return div;
    },

    onNewChat() {
        const chatId = ChatHistory.createNewChat();
        this.refresh();
        ChatUI.clear();
        ChatUI.showWelcome(false);
        ChatUI.focusInput();
    },

    onSelectChat(chatId) {
        ChatHistory.setCurrentChat(chatId);
        this.refresh();
        ChatUI.loadMessages(ChatHistory.getMessages(chatId));
        ChatUI.showWelcome(false);
    },

    onRenameChat(chatId, currentTitle) {
        const newTitle = prompt('Enter new title:', currentTitle);
        if (newTitle && newTitle.trim()) {
            ChatHistory.renameChat(chatId, newTitle.trim());
            this.refresh();
        }
    },

    onDeleteChat(chatId, title) {
        if (confirm(`Delete "${title}"?`)) {
            ChatHistory.deleteChat(chatId);
            this.refresh();

            if (ChatHistory.getChatList().length === 0) {
                ChatUI.showWelcome(true);
            } else {
                ChatUI.clear();
            }
        }
    },

    toggle() {
        this.element.classList.toggle('collapsed');
    },

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

        this.initModelSelector();

        // Show welcome or load current chat
        if (ChatHistory.currentChatId && ChatHistory.getCurrentChat()) {
            this.loadMessages(ChatHistory.getMessages());
            this.showWelcome(false);
        } else {
            this.showWelcome(true);
        }
    },

    bindEvents() {
        // Send button
        this.sendButton.addEventListener('click', () => {
            this.sendMessage();
        });

        // Enter key (without Shift)
        this.inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });

        // Auto-resize textarea
        this.inputField.addEventListener('input', () => {
            this.inputField.style.height = 'auto';
            this.inputField.style.height = Math.min(this.inputField.scrollHeight, 150) + 'px';
        });
    },

    initModelSelector() {
        const selector = document.getElementById('model-selector');
        const settings = Storage.getSettings();

        selector.innerHTML = '';

        // OpenAI models
        OpenAIClient.MODELS.forEach(model => {
            if (settings.visibleModels[model.id] !== false) {
                const option = document.createElement('option');
                option.value = `openai:${model.id}`;
                option.textContent = model.name;
                selector.appendChild(option);
            }
        });

        // Claude models
        ClaudeClient.MODELS.forEach(model => {
            if (settings.visibleModels[model.displayKey] !== false) {
                const option = document.createElement('option');
                option.value = `anthropic:${model.id}`;
                option.textContent = model.name;
                selector.appendChild(option);
            }
        });

        // Gemini models
        GeminiClient.MODELS.forEach(model => {
            if (settings.visibleModels[model.displayKey] !== false) {
                const option = document.createElement('option');
                option.value = `gemini:${model.id}`;
                option.textContent = model.name;
                selector.appendChild(option);
            }
        });

        // LM Studio models
        if (settings.visibleModels['lmstudio'] !== false) {
            const lmModels = settings.lmstudio?.models || [];
            if (lmModels.length > 0) {
                lmModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = `lmstudio:${model.id || model}`;
                    option.textContent = `LM Studio: ${model.name || model}`;
                    selector.appendChild(option);
                });
            } else {
                const option = document.createElement('option');
                option.value = 'lmstudio:local-model';
                option.textContent = 'LM Studio (Local)';
                selector.appendChild(option);
            }
        }

        // Set current model
        if (settings.currentModel) {
            const currentOption = [...selector.options].find(opt => opt.value.includes(settings.currentModel));
            if (currentOption) {
                selector.value = currentOption.value;
            }
        }

        // Save selection
        selector.addEventListener('change', () => {
            const [provider, modelId] = selector.value.split(':');
            settings.currentModel = modelId;
            Storage.saveSettings(settings);
        });
    },

    showWelcome(show) {
        if (show) {
            this.welcomeScreen.style.display = 'flex';
            this.chatArea.style.display = 'none';
        } else {
            this.welcomeScreen.style.display = 'none';
            this.chatArea.style.display = 'flex';
        }
    },

    loadMessages(messages) {
        this.messagesContainer.innerHTML = '';
        messages.forEach(msg => {
            this.addMessage(msg.role, msg.content, msg.model, false);
        });
        this.scrollToBottom();
    },

    addMessage(role, content, model = null, scroll = true) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;

        const headerDiv = document.createElement('div');
        headerDiv.className = 'message-header';
        headerDiv.innerHTML = `
            <span class="message-role">${role === 'user' ? 'You' : 'Assistant'}</span>
            ${model ? `<span class="message-model">${model}</span>` : ''}
        `;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.innerHTML = MarkdownParser.parse(content);

        msgDiv.appendChild(headerDiv);
        msgDiv.appendChild(contentDiv);
        this.messagesContainer.appendChild(msgDiv);

        if (scroll) {
            this.scrollToBottom();
        }
    },

    startStreaming() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant-message streaming';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'message-header';
        headerDiv.innerHTML = '<span class="message-role">Assistant</span>';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';

        msgDiv.appendChild(headerDiv);
        msgDiv.appendChild(contentDiv);
        this.messagesContainer.appendChild(msgDiv);

        this.currentStreamingElement = contentDiv;
        this.scrollToBottom();

        return contentDiv;
    },

    appendToStream(text) {
        if (this.currentStreamingElement) {
            // For streaming, just append raw text and update periodically
            const currentText = this.currentStreamingElement.dataset.rawText || '';
            this.currentStreamingElement.dataset.rawText = currentText + text;
            this.currentStreamingElement.textContent = this.currentStreamingElement.dataset.rawText;
            this.scrollToBottom();
        }
    },

    finishStreaming() {
        if (this.currentStreamingElement) {
            const rawText = this.currentStreamingElement.dataset.rawText || '';
            this.currentStreamingElement.innerHTML = MarkdownParser.parse(rawText);
            this.currentStreamingElement.parentElement.classList.remove('streaming');
            this.currentStreamingElement = null;
        }
    },

    async sendMessage() {
        const content = this.inputField.value.trim();
        if (!content || this.isGenerating) return;

        // Ensure we have a chat
        if (!ChatHistory.currentChatId) {
            ChatHistory.createNewChat();
            Sidebar.refresh();
            this.showWelcome(false);
        }

        // Add user message
        this.addMessage('user', content);
        ChatHistory.addMessage('user', content);
        Sidebar.refresh();

        // Clear input
        this.inputField.value = '';
        this.inputField.style.height = 'auto';

        // Get selected model
        const selector = document.getElementById('model-selector');
        const [provider, modelId] = selector.value.split(':');
        const modelName = selector.options[selector.selectedIndex].text;

        // Disable input
        this.setGenerating(true);

        try {
            // Start streaming display
            this.startStreaming();

            // Prepare messages for API
            const messages = ChatHistory.getMessages().map(m => ({
                role: m.role,
                content: m.content
            }));

            // Get settings
            const settings = Storage.getSettings();
            let fullResponse = '';

            // Call appropriate API
            const onChunk = (chunk) => {
                this.appendToStream(chunk);
            };

            switch (provider) {
                case 'openai':
                    fullResponse = await OpenAIClient.chat(messages, modelId, settings.apiKeys.openai, onChunk);
                    break;
                case 'anthropic':
                    fullResponse = await ClaudeClient.chat(messages, modelId, settings.apiKeys.anthropic, onChunk);
                    break;
                case 'gemini':
                    fullResponse = await GeminiClient.chat(messages, modelId, settings.apiKeys.gemini, onChunk);
                    break;
                case 'lmstudio':
                    fullResponse = await LMStudioClient.chat(messages, modelId, settings.lmstudio?.url, onChunk);
                    break;
            }

            // Finish streaming display
            this.finishStreaming();

            // Save assistant message
            ChatHistory.addMessage('assistant', fullResponse, modelName);
            Sidebar.refresh();

        } catch (error) {
            console.error('Chat error:', error);
            this.finishStreaming();
            this.addMessage('assistant', `Error: ${error.message}`);
            ChatHistory.addMessage('assistant', `Error: ${error.message}`);
        }

        this.setGenerating(false);
        this.focusInput();
    },

    setGenerating(generating) {
        this.isGenerating = generating;
        this.sendButton.disabled = generating;
        this.inputField.disabled = generating;
        this.sendButton.textContent = generating ? '...' : 'Send';
    },

    clear() {
        this.messagesContainer.innerHTML = '';
    },

    focusInput() {
        this.inputField.focus();
    },

    scrollToBottom() {
        this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
    }
};


// === settings.js ===
// ==================== Settings Dialog Module ====================

const SettingsDialog = {
    element: null,
    settings: null,

    init() {
        this.element = document.getElementById('settings-dialog');
        this.settings = Storage.getSettings();
        this.bindEvents();
    },

    bindEvents() {
        // Close button
        document.getElementById('settings-close-btn').addEventListener('click', () => {
            this.hide();
        });

        // Cancel button
        document.getElementById('settings-cancel-btn').addEventListener('click', () => {
            this.hide();
        });

        // Save button
        document.getElementById('settings-save-btn').addEventListener('click', () => {
            this.save();
        });

        // Tab switching
        document.querySelectorAll('.settings-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                this.switchTab(btn.dataset.tab);
            });
        });

        // LM Studio connect button
        document.getElementById('lmstudio-connect-btn').addEventListener('click', () => {
            this.connectLMStudio();
        });

        // Show/hide API key toggles
        document.querySelectorAll('.toggle-visibility-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🙈';
                } else {
                    input.type = 'password';
                    btn.textContent = '👁️';
                }
            });
        });

        // Close on overlay click
        this.element.addEventListener('click', (e) => {
            if (e.target === this.element) {
                this.hide();
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.element.classList.contains('visible')) {
                this.hide();
            }
        });
    },

    show() {
        this.settings = Storage.getSettings();
        this.loadValues();
        this.element.classList.add('visible');
    },

    hide() {
        this.element.classList.remove('visible');
    },

    switchTab(tabId) {
        // Update buttons
        document.querySelectorAll('.settings-tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabId);
        });

        // Update content
        document.querySelectorAll('.settings-tab-content').forEach(content => {
            content.classList.toggle('active', content.id === `tab-${tabId}`);
        });
    },

    loadValues() {
        // API Keys
        document.getElementById('openai-key').value = this.settings.apiKeys?.openai || '';
        document.getElementById('anthropic-key').value = this.settings.apiKeys?.anthropic || '';
        document.getElementById('gemini-key').value = this.settings.apiKeys?.gemini || '';

        // LM Studio
        document.getElementById('lmstudio-url').value = this.settings.lmstudio?.url || 'http://localhost:1234';
        this.updateLMStudioStatus('');

        // Model visibility
        const visibleModels = this.settings.visibleModels || {};
        document.querySelectorAll('.model-visibility-checkbox').forEach(checkbox => {
            const modelKey = checkbox.dataset.model;
            checkbox.checked = visibleModels[modelKey] !== false;
        });
    },

    async connectLMStudio() {
        const url = document.getElementById('lmstudio-url').value.trim() || 'http://localhost:1234';
        this.updateLMStudioStatus('Connecting...', 'pending');

        const isConnected = await LMStudioClient.validate(url);

        if (isConnected) {
            const models = await LMStudioClient.getModels(url);
            if (models.length > 0) {
                this.settings.lmstudio = {
                    url: url,
                    models: models
                };
                this.updateLMStudioStatus(`Connected! Found ${models.length} model(s)`, 'success');
                this.displayLMStudioModels(models);
            } else {
                this.updateLMStudioStatus('Connected, but no models loaded', 'warning');
                this.settings.lmstudio = { url: url, models: [] };
            }
        } else {
            this.updateLMStudioStatus('Connection failed. Is LM Studio running?', 'error');
        }
    },

    updateLMStudioStatus(message, status = '') {
        const statusEl = document.getElementById('lmstudio-status');
        statusEl.textContent = message;
        statusEl.className = 'connection-status ' + status;
    },

    displayLMStudioModels(models) {
        const container = document.getElementById('lmstudio-models-list');
        if (models.length === 0) {
            container.innerHTML = '<p class="no-models">No models loaded in LM Studio</p>';
            return;
        }

        container.innerHTML = models.map(m => `
            <div class="lmstudio-model-item">
                <span class="model-icon">🤖</span>
                <span class="model-name">${m.name || m.id}</span>
            </div>
        `).join('');
    },

    save() {
        // Save API keys
        this.settings.apiKeys = {
            openai: document.getElementById('openai-key').value.trim(),
            anthropic: document.getElementById('anthropic-key').value.trim(),
            gemini: document.getElementById('gemini-key').value.trim()
        };

        // Save LM Studio URL
        this.settings.lmstudio = this.settings.lmstudio || {};
        this.settings.lmstudio.url = document.getElementById('lmstudio-url').value.trim() || 'http://localhost:1234';

        // Save model visibility
        this.settings.visibleModels = {};
        document.querySelectorAll('.model-visibility-checkbox').forEach(checkbox => {
            this.settings.visibleModels[checkbox.dataset.model] = checkbox.checked;
        });

        // Save to storage
        Storage.saveSettings(this.settings);

        // Refresh UI
        ChatUI.initModelSelector();

        this.hide();
    }
};
